# Example nginx configuration for Portfolio Planner
#
# On your server, place this in:
# - /etc/nginx/sites-available/portfolio-planner
# - Then symlink to /etc/nginx/sites-enabled/
#
# Usage:
#   sudo ln -s /etc/nginx/sites-available/portfolio-planner /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # Change this to your domain or server IP

    # Optional: Redirect to HTTPS (if you have SSL configured)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://localhost:5959;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

